# Builds the Next Move home-screen widget (android/) into an APK. Separate from deploy.yml: this never touches the live site.
# Signing: set the repo secrets WIDGET_KEYSTORE (base64 of the .jks), WIDGET_STORE_PASSWORD, WIDGET_KEY_ALIAS and
# WIDGET_KEY_PASSWORD. Without them a debug APK is built instead, which can't be updated in place by later builds.
name: Android widget

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.
      # (android-actions/setup-android@v3 fails: it asks for the retired "tools" package.)

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.WIDGET_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/widget.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/widget.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No WIDGET_KEYSTORE secret, so this is a debug APK. Add the signing secrets before installing it for real."
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.WIDGET_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.WIDGET_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.WIDGET_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_STORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../next-move.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../next-move.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: next-move-apk
          path: next-move.apk
          retention-days: 30

      # One release per build, always with the same file name, so this link is always the newest APK (no login):
      # https://github.com/FaizGhazali/faiz-muna-journal/releases/latest/download/next-move.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -n "$SIGNING_STORE_FILE" ]; then kind="signed"; else kind="debug"; fi
          gh release create "widget-$RUN" next-move.apk \
            --target "${{ github.sha }}" \
            --title "Next Move widget 1.0.$RUN ($kind)" \
            --notes "Home-screen widget for the journal, built from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). On the phone: download next-move.apk, open it, allow installing from this source once, then open Next Move and sign in. $( [ "$kind" = debug ] && echo 'Debug build: a later signed build will not install over it; uninstall this one first.' )" \
            --latest
