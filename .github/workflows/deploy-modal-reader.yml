name: Deploy Modal receipt reader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modal/receipt_reader.py'
      - 'modal/receipt_reader_smoke.py'
      - '.github/workflows/deploy-modal-reader.yml'

permissions:
  contents: read

concurrency:
  group: modal-receipt-reader-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in this repository's Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal CLI
        run: python -m pip install modal==1.6.4
      - name: Verify Gemini extraction with synthetic documents
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run modal/receipt_reader_smoke.py::check_payslip
      - name: Deploy receipt and payslip reader
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal/receipt_reader.py
